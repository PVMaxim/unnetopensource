name: "Feature Request"
description: "Suggest an idea, enhancement, or new network integration for United Wallet."
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check existing issues to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe what you want to happen and how it should look or behave.
      placeholder: "Add support for..."
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: Category
      description: What type of enhancement is this?
      options:
        - "New Blockchain / Network Support"
        - "DEX Aggregator / Swap Provider"
        - "NFC Card Features & Commands"
        - "UI / UX Improvement"
        - "Developer Experience / Tooling"
        - "Other"
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: A clear description of any alternative solutions or features you've considered.

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any mockups, screenshots, or documentation links here.
