      <style>
        .initial-loader-wrapper {

          justify-content: center;
          align-items: center;

          position: relative;
          width: 60px;
          height: 60px;
          border-radius: 50%;
          border: 10px solid;
          border-color: rgba(255, 152, 0, 1) transparent;
          box-sizing: border-box;
          animation: s1 0.5s linear infinite;
          will-change: transform;
        }

        }
      </style>
