<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no">
    <title>United Wallet</title>

    <link rel="icon" type="image/png" sizes="32x32" href="/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicons/favicon-16x16.png">
    <link rel="shortcut icon" href="/favicons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png">
    <link rel="manifest" href="/favicons/site.webmanifest">

    <meta name="theme-color" content="#1e2026">
    <base href="/">

    <link rel="preload" href="/assets/fonts/InterTight-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/InterTight-cyrillic.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/poppins-v15-latin-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/poppins-v15-latin-500.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/assets/fonts/poppins-v15-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  </head>
  <body>
    <div id="united-network">
      <style>
        .initial-loader-wrapper {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          background-color: #1e2026;
          z-index: 999999;
        }
        .initial-loader-spinner {
          position: relative;
          width: 48px;
          height: 48px;
          border-radius: 50%;
          border: 4px solid;
          border-color: #ffffff transparent;
          box-sizing: border-box;
          animation: s1 0.6s linear infinite;
          will-change: transform;
        }
        @keyframes s1 {
          to { transform: rotate(1turn); }
        }
      </style>
      <div class="initial-loader-wrapper">
        <div class="initial-loader-spinner"></div>
      </div>
    </div>
    <noscript>
      <style>
        html, body, noscript, iframe {
          margin: 0;
          padding: 0;
          height: 100%;
          width: 100%;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          border: none;
        }
        #united-network {
          display: none;
        }
      </style>
      <iframe src="/noscript.html"></iframe>
    </noscript>
  </body>
  <script defer type="module" src="/main.js"></script>
</html>
